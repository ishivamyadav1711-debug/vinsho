<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F2EBE1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#8A174B" stroke-opacity="0.08" stroke-width="1.5" rx="8"/>
  <g transform="translate(300, 240)">
    <!-- Candle Flame -->
    <path d="M 0,-45 C 8,-20 18,-10 0,15 C -18,-10 -8,-20 0,-45 Z" fill="#D97706" opacity="0.75"/>
    <path d="M 0,-30 C 4,-15 10,-5 0,10 C -10,-5 -4,-15 0,-30 Z" fill="#F59E0B" opacity="0.9"/>
    <!-- Wick -->
    <rect x="-1.5" y="15" width="3" height="12" fill="#78350F"/>
    <!-- Candle Body -->
    <rect x="-35" y="27" width="70" height="95" rx="6" fill="#8A174B" opacity="0.15" stroke="#8A174B" stroke-dasharray="4 4" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <text x="50%" y="410" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="20" font-weight="600" fill="#8A174B" opacity="0.5" text-anchor="middle" letter-spacing="3">VINSHO STUDIO</text>
  <text x="50%" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8C7A6B" opacity="0.7" text-anchor="middle" letter-spacing="2">CANDLE COLLECTION &bull; DRAFT</text>
  <text x="50%" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A8988B" opacity="0.6" text-anchor="middle" letter-spacing="1">Photography Pending</text>
</svg>
